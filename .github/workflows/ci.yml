name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` rather than `npm install`, so this fails loudly if the
      # lockfile drifts. sharp is a declared devDependency for the logo script
      # and must survive a clean install — it used to arrive only as an
      # optional transitive dependency of next, which `--omit=optional` drops.
      - run: npm ci

      - run: npx tsc --noEmit
      - run: npm run lint

      # The check that matters most before a deploy: this is the same build
      # Vercel runs, so a failure here is a failure there.
      - run: npm run build

# Deliberately not running `npm run verify:apis`.
#
# It is a contract test against live upstreams — Jolpica allows 500 requests an
# hour and Open-Meteo is a courtesy — so putting it on every push would spend
# someone else's rate limit to tell us nothing about our own diff. It is a
# pre-deploy and post-upstream-change check, run by hand. See README.
